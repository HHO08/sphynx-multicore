name: Sphynx APK (armeabi-v7a only, all 23 cores)

# SPHYNX: single-ABI release build (armeabi-v7a) with every emulator core bundled.
#
# Pipeline:
#   1. checkout the fork (v1.18.1 base + extcores host + rebranding)
#   2. fetch the 23 libretro cores for armeabi-v7a, verify each one is an ARM ELF
#      that exports all required entry points and needs only NDK libraries
#   3. stage them as libsphynx_core_*.so inside the APK's native libs
#   4. build + sign the release APK
#   5. audit the finished APK: package id, signature, core count, per-core size
#
# Required repository secrets:
#   SPHYNX_KEYSTORE_BASE64, SPHYNX_KEYSTORE_PASSWORD, SPHYNX_KEY_ALIAS, SPHYNX_KEY_PASSWORD

on:
  push:
    branches:
      - sphynx-multicore-1.18.1
  workflow_dispatch:

env:
  SPHYNX_BASE_TAG: v1.18.1
  SPHYNX_VERSION_NAME: 1.18.1-sphynx.19
  SPHYNX_ABI: armeabi-v7a

jobs:
  build:
    name: release-${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a   # SPHYNX: single ABI by owner decision (no arm64-v8a)

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Make sure version tags exist (fork safety net)
        shell: bash
        run: |
          count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')
          echo "tags found: $count"
          if [ "$count" = "0" ]; then
            git remote add upstream https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags upstream || exit 0
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Free up runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/emulator /usr/share/swift 2>/dev/null || true
          df -h /

      - name: Fetch + verify the 23 emulator cores
        shell: bash
        run: |
          chmod +x Tools/sphynx/fetch_cores.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils unzip \
              libegl1 libgles2 libgl1-mesa-dri
          Tools/sphynx/fetch_cores.sh "${{ matrix.abi }}" "android/src/normal/jniLibs/${{ matrix.abi }}"

      - name: Core inventory
        shell: bash
        run: |
          ls -la "android/src/normal/jniLibs/${{ matrix.abi }}" | tail -30
          du -sh "android/src/normal/jniLibs/${{ matrix.abi }}"

      - name: Host tests (extcores layer)
        shell: bash
        run: |
          set -eux
          mkdir -p out
          gcc -shared -fPIC -O2 -Iextcores/include -o out/libstub_core.so extcores/tests/stub_core.c
          echo 'void b(void){}' > out/b.c
          gcc -shared -fPIC -o out/libbroken_core.so out/b.c
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Iextcores/include -Iextcores/src \
              -o out/host_smoke extcores/src/system_db.cpp extcores/src/core_loader.cpp \
              extcores/src/core_defaults.cpp extcores/src/env_callback.cpp extcores/src/session.cpp \
              extcores/src/diag_log.cpp extcores/tests/host_smoke.cpp -ldl -pthread
          ./out/host_smoke ./out/libstub_core.so ./out/libbroken_core.so | tee out/host-test.txt

          # Stage 4: the UI bridge (game list filter, archive routing, the
          # chooser for ambiguous discs, the PNG thumbnail encoder).
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Iextcores/include \
              -o out/host_ui_test extcores/src/system_db.cpp extcores/src/core_loader.cpp \
              extcores/src/core_defaults.cpp extcores/src/env_callback.cpp extcores/src/session.cpp \
              extcores/src/png_write.cpp extcores/src/ui_api.cpp \
              extcores/src/android_paths.cpp extcores/src/bios_layout.cpp \
              extcores/src/state_file.cpp extcores/src/diag_log.cpp \
              extcores/tests/host_ui_test.cpp -ldl -pthread
          ./out/host_ui_test | tee out/host-ui-test.txt

          # Stage 5: the real play path, end to end on the host toolchain —
          # content:// URI resolution, thumbnail through a dlopen()ed core,
          # player session (frames/audio/input/save state).
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Iextcores/include -Iextcores/src \
              -o out/host_play_test extcores/src/system_db.cpp extcores/src/core_loader.cpp \
              extcores/src/core_defaults.cpp extcores/src/env_callback.cpp extcores/src/session.cpp \
              extcores/src/png_write.cpp extcores/src/ui_api.cpp \
              extcores/src/android_paths.cpp extcores/src/bios_layout.cpp \
              extcores/src/state_file.cpp extcores/src/diag_log.cpp \
              extcores/src/player_core.cpp extcores/src/hw_render.cpp \
              extcores/src/player_audio.cpp \
              extcores/tests/host_play_test.cpp -ldl -pthread
          # Stage 19: the hardware-render path (N64 mupen64plus_next, Dreamcast
          # flycast) is exercised through a real GLES2 context, so the job needs
          # a working EGL. Mesa's software renderer is enough and needs no GPU.
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 \
              ./out/host_play_test ./out/libstub_core.so | tee out/host-play-test.txt

          # Stage 6: PSP/SYSTEMS_BIOS (16 folders, READMEs, adoption of an
          # existing PSP/SYSTEM, missing-file reporting) and the save state file
          # format (round trip, wrong core, corruption).
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Iextcores/include -Iextcores/src \
              -o out/host_bios_test extcores/src/system_db.cpp extcores/src/core_loader.cpp \
              extcores/src/core_defaults.cpp extcores/src/env_callback.cpp extcores/src/session.cpp \
              extcores/src/png_write.cpp extcores/src/ui_api.cpp \
              extcores/src/android_paths.cpp extcores/src/bios_layout.cpp \
              extcores/src/state_file.cpp extcores/src/diag_log.cpp \
              extcores/tests/host_bios_test.cpp -ldl -pthread
          ./out/host_bios_test | tee out/host-bios-test.txt

          # Stage 15: "the best settings for this core" — the explicit table, the
          # generic rules over the core's own options, and the two safety rules
          # (never invent a key, never use a value the core did not offer). Also
          # proves that a value the user picked always wins.
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Iextcores/include -Iextcores/src \
              -o out/host_defaults_test extcores/src/system_db.cpp extcores/src/core_loader.cpp \
              extcores/src/core_defaults.cpp extcores/src/env_callback.cpp \
              extcores/src/diag_log.cpp \
              extcores/tests/host_defaults_test.cpp -ldl -pthread
          ./out/host_defaults_test | tee out/host-defaults-test.txt

          # The Android-only translation units never get compiled on a runner
          # without the NDK; type-check them against the stub headers so a typo
          # fails here (in seconds) instead of after the APK build (in minutes).
          JAVA_HOME="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
          g++ -std=c++17 -fsyntax-only -Wall -Wextra -Wno-unused-parameter -DSPHYNX_ANDROID=1 \
              -Iextcores/tests/android-stubs -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
              -Iextcores/include -Iextcores/src \
              extcores/jni/sphynx_extcore_jni.cpp \
              extcores/src/android_paths.cpp extcores/src/ui_api.cpp \
              extcores/src/bios_layout.cpp extcores/src/state_file.cpp \
              extcores/src/diag_log.cpp extcores/src/player_core.cpp \
              extcores/src/player_audio.cpp extcores/src/core_defaults.cpp \
              extcores/src/hw_render.cpp

          # Stage 9: the player core that PPSSPP's own screen drives. It has no
          # host test (it needs a core to run), but it must at least compile
          # with the same flags the portable layer uses.
          g++ -std=c++17 -fsyntax-only -Wall -Wextra -Wno-unused-parameter \
              -Iextcores/include -Iextcores/src \
              extcores/src/player_core.cpp extcores/src/player_audio.cpp

          # Stage 6: every game launch path must go through SphynxRouteExternal().
          # This is the static guard for the "Failed initializing CPU or memory"
          # bug, which came back once because GameScreen::OnPlay skipped
          # LaunchFile(). It also proves the player still offers
          # Save state / Load state / Settings.
          python3 Tools/sphynx/check_routing.py . | tee out/routing-check.txt

          # Stage 6: the NDK's clang rejects a C++ return type inside an
          # extern "C" block (GCC does not warn, so this cost a whole build).
          python3 Tools/sphynx/check_linkage.py . | tee out/linkage-check.txt

      - name: Write signing config outside the repository
        env:
          KEYSTORE_B64: ${{ secrets.SPHYNX_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SPHYNX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPHYNX_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SPHYNX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::secret SPHYNX_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sphynx-release.keystore"
          mkdir -p "$HOME/.gradle"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/sphynx-release.keystore"
            echo "RELEASE_STORE_PASSWORD=$KS_PASS"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> "$HOME/.gradle/gradle.properties"
          keytool -list -keystore "$RUNNER_TEMP/sphynx-release.keystore" -storepass "$KS_PASS" | head -5

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNormalRelease \
            -PsphynxAbi=${{ matrix.abi }} \
            -PANDROID_VERSION_NAME=${{ env.SPHYNX_VERSION_NAME }}

      - name: Audit the finished APK
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find android/build -name '*.apk' -path '*release*' | head -1)
          test -n "$APK"
          TARGET="out/sphynx-${{ matrix.abi }}-${SPHYNX_BASE_TAG}.apk"
          cp "$APK" "$TARGET"
          SIZE=$(stat -c%s "$TARGET")
          MB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1048576}")
          echo "size_mb=$MB" >> "$GITHUB_OUTPUT"

          # how many emulator cores actually made it into the APK?
          CORES=$(unzip -l "$TARGET" | grep -c 'libsphynx_core_.*\.so' || true)
          echo "cores_in_apk=$CORES" >> "$GITHUB_OUTPUT"
          echo "APK: $TARGET ($MB MiB), emulator cores inside: $CORES"
          test "$CORES" -ge 23 || { echo "::error::expected 23 cores in the APK, found $CORES"; exit 1; }

          # Stage 10 self-check: the stale Activity-based player must not be in
          # this APK at all, and the in-process player must be. Without this,
          # an old build could be handed over by mistake and would look exactly
          # like the bug being "not fixed".
          CLASSES=$(unzip -p "$TARGET" classes.dex | strings | grep -c 'SphynxPlayerActivity' || true)
          if [ "${CLASSES:-0}" != "0" ]; then
            echo "::error::this APK still contains the old SphynxPlayerActivity"
            exit 1
          fi
          unzip -p "$TARGET" lib/armeabi-v7a/libppsspp_jni.so > /tmp/jni.so
          for sym in SphynxPlayerScreen SphynxPauseScreen; do
            strings /tmp/jni.so | grep -q "$sym" || { echo "::error::missing $sym in libppsspp_jni.so"; exit 1; }
          done
          for sym in sphynx_player_open sphynx_player_run sphynx_player_take_frame \
                     sphynx_player_bios_report sphynx_ui_prepare_bios; do
            unzip -p "$TARGET" lib/armeabi-v7a/libsphynx_extcore.so | strings | grep -q "$sym" \
              || { echo "::error::missing $sym in libsphynx_extcore.so"; exit 1; }
          done
          # Stage 15: the recommendation table really is compiled in (the DS
          # white-screen fix lives there), and the stale-open repair is present.
          for text in melonds_renderer mupen64plus-Resolution self-repair; do
            unzip -p "$TARGET" lib/armeabi-v7a/libsphynx_extcore.so | strings | grep -q "$text" \
              || { echo "::error::missing stage-15 text $text in libsphynx_extcore.so"; exit 1; }
          done
          echo "in-process player verified in the APK; old Activity absent"

          unzip -l "$TARGET" | grep -E 'lib/' | sort -k1 -n -r | head -30
          sha256sum "$TARGET" | tee out/SHA256SUMS.txt

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name apksigner -type f 2>/dev/null | sort -r | head -1 || true)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$TARGET" | head -12 | tee out/signature.txt; fi

          {
            echo "### Sphynx release build — ${{ matrix.abi }}"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| APK size | **${MB} MiB** |"
            echo "| emulator cores bundled | **${CORES}** |"
            echo "| base tag | ${SPHYNX_BASE_TAG} |"
            echo ""
            echo "| library | uncompressed |"
            echo "|---|---|"
            unzip -l "$TARGET" | awk '/lib\// {printf "| %s | %.1f MiB |\n", $4, $1/1048576}' | sort -t'|' -k2 -rn | head -30
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sphynx-${{ matrix.abi }}-release
          path: out/
          retention-days: 30
          if-no-files-found: error
